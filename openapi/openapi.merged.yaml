  responses:
    Problem400:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: Not authenticated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: Not allowed for this client or role
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflict with current state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: Gone (e.g. session-expired)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Business rule violated (problem type names the rule)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Rate limited
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: Temporarily unavailable (e.g. partner-paused, otp-unavailable)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        maxLength: 64
      description: Required on every partner write call (AC-35.2, AC-35.4)
    Signature:
      name: X-CreditPulse-Signature
      in: header
      required: true
      schema:
        type: string
      description: HMAC-SHA256 over timestamp + body with the endpoint signing secret; stale or reused events are rejected (AC-33.4)
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
webhooks:
  loan.booked:
    post:
      operationId: webhookLoanBooked
      summary: Loan booked and disbursed; order can be confirmed
      x-stories:
        - US-41
        - US-05
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerEvent'
      responses:
        '200':
          description: Partner acknowledges; any non-2xx is retried with backoff (AC-41.3)
  loan.updated:
    post:
      operationId: webhookLoanUpdated
      summary: Schedule or balance changed (repayment, refund, restructuring, settlement)
      x-stories:
        - US-45
