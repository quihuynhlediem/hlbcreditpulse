  /api/v1/demo/reset:
    post:
      operationId: resetDemoData
      tags:
        - demo
      summary: Reset fixtures (mock mode only)
      x-stories:
        - US-02
      x-mock-only: true
      security: []
      responses:
        '200':
          description: OK
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-demo-only: true
  /api/v1/console/api-calls:
    get:
      operationId: listApiCalls
      tags:
        - console
      summary: API inspector timeline
