          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-demo-only: true
      security: []
components:
  securitySchemes:
    partnerOAuth:
      type: oauth2
      description: Partner client credentials; tokens are short-lived and scoped to products (AC-35.1)
      flows:
        clientCredentials:
          tokenUrl: https://auth.creditpulse.hlb.example/oauth2/token
          scopes:
            lending: Applications, decisions, contracts
            servicing: Loans, repayments, hardship
            events: Inbound partner events
    partnerMtls:
      type: mutualTLS
      description: Client certificate registered per partner credential (US-65)
    staffOidc:
      type: openIdConnect
      openIdConnectUrl: https://sso.hlb.example/.well-known/openid-configuration
      description: HLB staff SSO (D-69); roles from role grants (US-59)
    servicingSession:
      type: http
      scheme: bearer
      description: Short-lived borrower session after OTP sign-in (US-51)
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
        - type
        - title
        - status
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: VND has no minor unit; amount is whole VND
        currency:
          type: string
          enum:
            - VND
      required:
        - amount
        - currency
    PartnerId:
      type: string
      enum:
        - viettel-money
        - grab
        - so-ban-hang
    ProductType:
      type: string
      enum:
        - PAYMENT_INSTALLMENT
      description: 'D-37: one API, three product types'
    Segment:
      type: string
      enum:
        - SEG-1
        - SEG-2
        - SEG-3
        - SEG-4
        - SEG-5
    SourceId:
      type: string
      enum:
        - B-01
        - B-02
        - AD-01
        - AD-02
        - AD-03
        - AD-04
        - AD-05
        - AD-06
        - AD-07
        - AD-08
        - AD-09
        - AD-10
      description: Step 07 §4 catalogue
    RatingOutput:
      type: string
      enum:
        - RG
        - AF
        - IN
        - LM
    InterestPayer:
      type: string
      enum:
        - CUSTOMER
        - MERCHANT
    DecisionOutcome:
      type: string
      enum:
        - APPROVED
        - COUNTER_OFFER
        - DECLINED
      description: The engine always decides (D-77); there is no pending or referred outcome
    ConsentStatus:
      type: string
      enum:
        - GRANTED
        - WITHDRAWN
    EkycMethod:
      type: string
      enum:
        - NFC_CHIP
        - CAPTURE_FALLBACK
    EkycStatus:
      type: string
      enum:
        - PASSED
        - FAILED
        - RETRY
    LoanStatus:
      type: string
      enum:
        - ACTIVE
        - PAUSED
        - LATE
        - SETTLED
    SourceUse:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/RatingOutput'
        connected:
          type: boolean
        role:
          type: string
        weightScore:
          type: number
        variablesRead:
          type: array
          items:
            type: string
          description: Variables read from this source for the decision (operator view)
        costVnd:
          type: integer
        latencyMs:
          type: integer
      required:
        - sourceId
        - name
        - rank
        - outputs
        - connected
        - role
        - weightScore
    PrescreenRequest:
      type: object
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        hashedCustomerId:
          type: string
      required:
        - partnerId
        - hashedCustomerId
    PrescreenResult:
      type: object
      properties:
        eligible:
          type: boolean
        bandMin:
          $ref: '#/components/schemas/Money'
        bandMax:
          $ref: '#/components/schemas/Money'
        rung:
          type: integer
        reason:
          type: string
          description: Why the customer is not eligible, in user language (e.g. a driver under 3 months). Present only when eligible is false.
        validUntil:
          type: string
          format: date-time
      required:
        - eligible
    OfferRequestCreate:
      type: object
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        productType:
          $ref: '#/components/schemas/ProductType'
        customerRef:
          type: string
        orderRef:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        consentReceiptIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - partnerId
        - productType
        - customerRef
        - amount
    Package:
      type: object
      properties:
        packageId:
          type: string
        tenorMonths:
          type: integer
        monthlyInstalment:
          $ref: '#/components/schemas/Money'
        totalPayable:
          $ref: '#/components/schemas/Money'
        eir:
          type: number
          description: Effective annual rate, e.g. 0.125 = 12.5%
        interestPayer:
          $ref: '#/components/schemas/InterestPayer'
        available:
          type: boolean
        disabledReason:
          type: string
      required:
        - packageId
        - tenorMonths
        - monthlyInstalment
        - totalPayable
        - eir
        - interestPayer
        - available
    NextRung:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        unlockLimit:
          $ref: '#/components/schemas/Money'
      required:
        - sourceId
        - unlockLimit
    OfferSet:
      type: object
      properties:
        offerRequestId:
          type: string
          format: uuid
        limit:
          $ref: '#/components/schemas/Money'
        rung:
          type: integer
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
        reasonCodes:
          type: array
          items:
            type: string
        nextRung:
          $ref: '#/components/schemas/NextRung'
        explanationText:
          type: string
        expiresAt:
          type: string
          format: date-time
        lockup:
          type: string
      required:
        - offerRequestId
        - limit
        - rung
        - packages
        - reasonCodes
        - expiresAt
        - lockup
    ConsentCreate:
      type: object
      properties:
        customerRef:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        sourceId:
          $ref: '#/components/schemas/SourceId'
        purpose:
          type: string
        textVersion:
          type: string
        signature:
          type: string
        grantedAt:
          type: string
          format: date-time
      required:
        - customerRef
        - partnerId
        - sourceId
        - textVersion
        - signature
    ConsentReceipt:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        customerRef:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        sourceId:
          $ref: '#/components/schemas/SourceId'
        purpose:
          type: string
        status:
          $ref: '#/components/schemas/ConsentStatus'
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
      required:
        - receiptId
        - customerRef
        - sourceId
        - status
    EkycRequest:
      type: object
      properties:
        customerRef:
          type: string
        method:
          $ref: '#/components/schemas/EkycMethod'
        chipPayloadRef:
          type: string
        faceCaptureRef:
          type: string
      required:
        - customerRef
        - method
    EkycResult:
      type: object
      properties:
        verificationId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EkycStatus'
        reasonCode:
          type: string
        reusableUntil:
          type: string
          format: date-time
      required:
        - verificationId
        - status
    LadderRung:
      type: object
      properties:
        rung:
          type: integer
        cap:
          $ref: '#/components/schemas/Money'
        reached:
          type: boolean
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceUse'
        unlocksText:
          type: string
      required:
        - rung
        - cap
        - reached
        - sources
    LimitLadder:
      type: object
      properties:
        customerRef:
          type: string
        segment:
          $ref: '#/components/schemas/Segment'
        currentRung:
          type: integer
        currentLimit:
          $ref: '#/components/schemas/Money'
        rungs:
          type: array
          items:
            $ref: '#/components/schemas/LadderRung'
        nextSuggestion:
          $ref: '#/components/schemas/NextRung'
        cicState:
          type: string
          enum:
            - NO_FILE
            - FILE_FOUND
            - NOT_QUERIED
      required:
        - customerRef
        - segment
        - currentRung
        - currentLimit
        - rungs
        - cicState
    AssessmentCreate:
      type: object
      properties:
        customerRef:
          type: string
        offerRequestId:
          type: string
          format: uuid
        packageId:
          type: string
        productType:
          $ref: '#/components/schemas/ProductType'
        amount:
          $ref: '#/components/schemas/Money'
        connectSources:
          type: array
          items:
            $ref: '#/components/schemas/SourceId'
      required:
        - customerRef
        - productType
        - amount
    WaterfallStep:
      type: object
      properties:
        order:
          type: integer
        sourceId:
          $ref: '#/components/schemas/SourceId'
        status:
          type: string
          enum:
            - QUERIED
            - SKIPPED
            - UNAVAILABLE
        costVnd:
          type: integer
        latencyMs:
          type: integer
        stopReason:
          type: string
      required:
        - order
        - sourceId
        - status
    Ratings:
      type: object
      properties:
        riskGrade:
          type: string
          enum:
            - A
            - B
            - C
            - D
            - E
        affordability:
          $ref: '#/components/schemas/Money'
        integrity:
          type: string
          enum:
            - PASS
            - REVIEW
            - FAIL
        limit:
          $ref: '#/components/schemas/Money'
    Decision:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        approvedAmount:
          $ref: '#/components/schemas/Money'
        tenorMonths:
          type: integer
        reasonCodes:
          type: array
          items:
            type: string
        explanationText:
          type: string
        dataUsed:
          type: array
          items:
            $ref: '#/components/schemas/SourceUse'
        ratings:
          $ref: '#/components/schemas/Ratings'
        waterfall:
          type: array
          items:
            $ref: '#/components/schemas/WaterfallStep'
        nextRung:
          $ref: '#/components/schemas/NextRung'
        retryAfter:
          type: string
          format: date-time
        latencyMs:
          type: integer
        decidedAt:
          type: string
          format: date-time
        appealStatus:
          $ref: '#/components/schemas/AppealStatus'
        requestedAmount:
          $ref: '#/components/schemas/Money'
        appealable:
          type: boolean
          description: True for COUNTER_OFFER and DECLINED within 30 days and without an appeal (D-78)
        appealDeadline:
          type: string
          format: date-time
        appeal:
          $ref: '#/components/schemas/AppealSummary'
      required:
        - decisionId
        - outcome
        - reasonCodes
        - explanationText
        - dataUsed
        - ratings
        - waterfall
        - latencyMs
        - decidedAt
    ContractCreate:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        packageId:
          type: string
      required:
        - decisionId
        - packageId
    Instalment:
      type: object
      properties:
        number:
          type: integer
        dueDate:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
            - DUE
            - PAID
            - LATE
            - PAUSED
      required:
        - number
        - dueDate
        - amount
    Contract:
      type: object
      properties:
        contractId:
          type: string
          format: uuid
        lender:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        tenorMonths:
          type: integer
        totalPayable:
          $ref: '#/components/schemas/Money'
        eir:
          type: number
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/Instalment'
        keyFacts:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - DRAFT
            - SIGNED
            - EXPIRED
      required:
        - contractId
        - lender
        - amount
        - tenorMonths
        - totalPayable
        - eir
        - schedule
        - keyFacts
        - status
    ContractSign:
      type: object
      properties:
        otp:
          type: string
      required:
        - otp
    Loan:
      type: object
      properties:
        loanId:
          type: string
          format: uuid
        customerRef:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        productType:
          $ref: '#/components/schemas/ProductType'
        status:
          $ref: '#/components/schemas/LoanStatus'
        principalRemaining:
          $ref: '#/components/schemas/Money'
        totalRemaining:
          $ref: '#/components/schemas/Money'
        eir:
          type: number
        schedule:
          type: array
          items:
            $ref: '#/components/schemas/Instalment'
        pauseUntil:
          type: string
          format: date
      required:
        - loanId
        - customerRef
        - partnerId
        - productType
        - status
        - principalRemaining
        - totalRemaining
        - eir
        - schedule
    PaymentCreate:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Money'
      required:
        - amount
    SettlementQuote:
      type: object
      properties:
        loanId:
          type: string
          format: uuid
        payoff:
          $ref: '#/components/schemas/Money'
        interestSaved:
          $ref: '#/components/schemas/Money'
        validUntil:
          type: string
          format: date-time
      required:
        - loanId
        - payoff
    RefundEvent:
      type: object
      properties:
        loanId:
          type: string
          format: uuid
        orderRef:
          type: string
        refundAmount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
      required:
        - loanId
        - orderRef
        - refundAmount
    RefundResult:
      type: object
      properties:
        loanId:
          type: string
          format: uuid
        newPrincipal:
          $ref: '#/components/schemas/Money'
        newSchedule:
          type: array
          items:
            $ref: '#/components/schemas/Instalment'
        pauseUntil:
          type: string
          format: date
        adverseCicReported:
          type: boolean
      required:
        - loanId
        - newPrincipal
        - pauseUntil
    GraduationOffer:
      type: object
      properties:
        customerRef:
          type: string
        newLimit:
          $ref: '#/components/schemas/Money'
        productOffers:
          type: array
          items:
            type: string
        merchantCode:
          type: string
      required:
        - customerRef
        - newLimit
    DecisionSummary:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        customerMask:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        productType:
          $ref: '#/components/schemas/ProductType'
        amount:
          $ref: '#/components/schemas/Money'
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        latencyMs:
          type: integer
        decidedAt:
          type: string
          format: date-time
        appealStatus:
          $ref: '#/components/schemas/AppealStatus'
      required:
        - decisionId
        - customerMask
        - partnerId
        - productType
        - amount
        - outcome
        - latencyMs
        - decidedAt
    DecisionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DecisionSummary'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
      required:
        - items
        - page
        - size
        - totalItems
    RankingWeights:
      type: object
      properties:
        predictive:
          type: number
        coverage:
          type: number
        cost:
          type: number
        access:
          type: number
        legal:
          type: number
      required:
        - predictive
        - coverage
        - cost
        - access
        - legal
    RankedSource:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        score:
          type: number
        ratings:
          type: object
          properties:
            predictive:
              type: integer
            coverage:
              type: integer
            cost:
              type: integer
            access:
              type: integer
            legal:
              type: integer
      required:
        - sourceId
        - name
        - rank
        - score
        - ratings
    Ranking:
      type: object
      properties:
        weights:
          $ref: '#/components/schemas/RankingWeights'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RankedSource'
        waterfallOrder:
          type: array
          items:
            $ref: '#/components/schemas/SourceId'
        segmentRungMatrix:
          type: array
          items:
            type: object
            properties:
              segment:
                $ref: '#/components/schemas/Segment'
              rungs:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SourceId'
      required:
        - weights
        - sources
        - waterfallOrder
