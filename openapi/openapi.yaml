components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - type
      - title
      - status
    Money:
      type: object
      properties:
        amount:
          type: integer
          description: VND has no minor unit; amount is whole VND
        currency:
          type: string
          enum:
          - VND
      required:
      - amount
      - currency
    PartnerId:
      type: string
      enum:
      - viettel-money
      - grab
      - so-ban-hang
    ProductType:
      type: string
      enum:
      - PAYMENT_INSTALLMENT
      - DRIVER_INSTANT_LOAN
      - SELLER_FUNDING
      description: 'D-37: one API, three product types'
    Segment:
      type: string
      enum:
      - SEG-1
      - SEG-2
      - SEG-3
      - SEG-4
      - SEG-5
    SourceId:
      type: string
      enum:
      - B-01
      - B-02
      - AD-01
      - AD-02
      - AD-03
      - AD-04
      - AD-05
      - AD-06
      - AD-07
      - AD-08
      - AD-09
      - AD-10
      description: Step 07 §4 catalogue
    RatingOutput:
      type: string
      enum:
      - RG
      - AF
      - IN
      - LM
    InterestPayer:
      type: string
      enum:
      - CUSTOMER
      - MERCHANT
    DecisionOutcome:
      type: string
      enum:
      - APPROVED
      - DECLINED
      - MANUAL_REVIEW
    DecisionTier:
      type: string
      enum:
      - STP
      - MANUAL
    ConsentStatus:
      type: string
      enum:
      - GRANTED
      - WITHDRAWN
    EkycMethod:
      type: string
      enum:
      - NFC_CHIP
      - CAPTURE_FALLBACK
    EkycStatus:
      type: string
      enum:
      - PASSED
      - FAILED
      - RETRY
    LoanStatus:
      type: string
      enum:
      - ACTIVE
      - PAUSED
      - LATE
      - SETTLED
    ScenarioName:
      type: string
      enum:
      - APPROVE
      - THIN_FILE
      - NOT_APPROVED
      - MANUAL_REVIEW
      - SLOW
      - EKYC_FAIL
      - SOURCE_DOWN
      - SESSION_EXPIRED
    SourceUse:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/RatingOutput'
        connected:
          type: boolean
        role:
          type: string
        weightScore:
          type: number
        variablesRead:
          type: array
          items:
            type: string
          description: Variables read from this source for the decision (operator view)
        costVnd:
          type: integer
        latencyMs:
          type: integer
      required:
      - sourceId
      - name
      - rank
      - outputs
      - connected
      - role
      - weightScore
    PrescreenRequest:
      type: object
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        hashedCustomerId:
          type: string
      required:
      - partnerId
      - hashedCustomerId
    PrescreenResult:
      type: object
      properties:
        eligible:
          type: boolean
        bandMin:
          $ref: '#/components/schemas/Money'
        bandMax:
          $ref: '#/components/schemas/Money'
        rung:
          type: integer
        reason:
          type: string
          description: Why the customer is not eligible, in user language (e.g. a driver under 3 months). Present only when eligible is false.
        validUntil:
          type: string
          format: date-time
      required:
      - eligible
    OfferRequestCreate:
      type: object
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        productType:
          $ref: '#/components/schemas/ProductType'
        customerRef:
          type: string
        orderRef:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        consentReceiptIds:
          type: array
          items:
            type: string
            format: uuid
      required:
      - partnerId
      - productType
      - customerRef
      - amount
    Package:
      type: object
      properties:
        packageId:
          type: string
        tenorMonths:
          type: integer
        monthlyInstalment:
          $ref: '#/components/schemas/Money'
        totalPayable:
          $ref: '#/components/schemas/Money'
        eir:
          type: number
          description: Effective annual rate, e.g. 0.125 = 12.5%
        interestPayer:
          $ref: '#/components/schemas/InterestPayer'
        available:
          type: boolean
        disabledReason:
          type: string
      required:
      - packageId
      - tenorMonths
      - monthlyInstalment
      - totalPayable
      - eir
      - interestPayer
      - available
    NextRung:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        unlockLimit:
