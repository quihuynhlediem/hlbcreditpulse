        partnerId:
          $ref: '#/components/schemas/PartnerId'
        productType:
          $ref: '#/components/schemas/ProductType'
        amount:
          $ref: '#/components/schemas/Money'
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        latencyMs:
          type: integer
        decidedAt:
          type: string
          format: date-time
        appealStatus:
          $ref: '#/components/schemas/AppealStatus'
      required:
      - decisionId
      - customerMask
      - partnerId
      - productType
      - amount
      - outcome
      - latencyMs
      - decidedAt
    DecisionPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DecisionSummary'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
      required:
      - items
      - page
      - size
      - totalItems
    RankingWeights:
      type: object
      properties:
        predictive:
          type: number
        coverage:
          type: number
        cost:
          type: number
        access:
          type: number
        legal:
          type: number
      required:
      - predictive
      - coverage
      - cost
      - access
      - legal
    RankedSource:
      type: object
      properties:
        sourceId:
          $ref: '#/components/schemas/SourceId'
        name:
          type: string
        rank:
          type: integer
        score:
          type: number
        ratings:
          type: object
          properties:
            predictive:
              type: integer
            coverage:
              type: integer
            cost:
              type: integer
            access:
              type: integer
            legal:
              type: integer
      required:
      - sourceId
      - name
      - rank
      - score
      - ratings
    Ranking:
      type: object
      properties:
        weights:
          $ref: '#/components/schemas/RankingWeights'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/RankedSource'
        waterfallOrder:
          type: array
          items:
            $ref: '#/components/schemas/SourceId'
        segmentRungMatrix:
          type: array
          items:
            type: object
            properties:
              segment:
                $ref: '#/components/schemas/Segment'
              rungs:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/SourceId'
      required:
