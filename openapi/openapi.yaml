          items:
            $ref: '#/components/schemas/Package'
        reasonCodes:
          type: array
          items:
            type: string
        nextRung:
          $ref: '#/components/schemas/NextRung'
        explanationText:
          type: string
        expiresAt:
          type: string
          format: date-time
        lockup:
          type: string
      required:
      - offerRequestId
      - limit
      - rung
      - packages
      - reasonCodes
      - expiresAt
      - lockup
    ConsentCreate:
      type: object
      properties:
        customerRef:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        sourceId:
          $ref: '#/components/schemas/SourceId'
        purpose:
          type: string
        textVersion:
          type: string
        signature:
          type: string
        grantedAt:
          type: string
          format: date-time
      required:
      - customerRef
      - partnerId
      - sourceId
      - textVersion
      - signature
    ConsentReceipt:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        customerRef:
          type: string
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        sourceId:
          $ref: '#/components/schemas/SourceId'
        purpose:
          type: string
        status:
          $ref: '#/components/schemas/ConsentStatus'
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
