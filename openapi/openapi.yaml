openapi: 3.1.0
info:
  title: HLB CreditPulse API
  version: 0.1.4
  summary: Backend credit engine behind partner wallets (R-17, D-37)
  description: One API, three product types. Partners own customer screens and call this API; consent text is supplied by HLB and receipts are stored here (D-30). Money is integer VND (no minor unit). Examples use demo personas (Mai, Khoa, Tùng, Hùng, Phụng); amounts are illustrative (D-28). Endpoints tagged `x-mock-only` exist only in the MVP mock.
  license:
    name: Proprietary (demo)
servers:
- url: https://api.creditpulse.example
  description: Placeholder; MVP uses MSW
security:
- bearerAuth: []
tags:
- name: pre-screen
- name: offers
- name: consent
- name: identity
- name: data-ladder
- name: decision
- name: contract
- name: servicing
- name: refunds
- name: income-lending
- name: graduation
- name: console
- name: demo
paths:
  /api/v1/prescreens:
    post:
      operationId: createPrescreen
      tags:
      - pre-screen
      summary: Indicative limit band from a hashed ID (G-12)
      x-stories:
      - US-04
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescreenRequest'
            example:
              partnerId: viettel-money
              hashedCustomerId: h_9f2c…khoa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescreenResult'
              example:
                eligible: true
                bandMin:
                  amount: 5000000
                  currency: VND
                bandMax:
                  amount: 30000000
                  currency: VND
                rung: 4
                validUntil: '2026-10-10T00:00:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/offers:
    post:
      operationId: createOfferRequest
      tags:
      - offers
      summary: Create an offer set for an order, loan request or restock
      x-stories:
      - US-06
      - US-07
      - US-23
      - US-26
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferRequestCreate'
            example:
              partnerId: viettel-money
              productType: PAYMENT_INSTALLMENT
              customerRef: cus_mai
              orderRef: SPE-2026-0001
              amount:
                amount: 12000000
                currency: VND
              consentReceiptIds: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSet'
              example:
                offerRequestId: b1c0e3a2-6f7d-4b29-8c11-0d2e9a000001
                limit:
                  amount: 15000000
                  currency: VND
                rung: 3
                packages:
                - packageId: pkg-6
                  tenorMonths: 6
                  monthlyInstalment:
                    amount: 2000000
                    currency: VND
                  totalPayable:
                    amount: 12000000
                    currency: VND
                  eir: 0.0
                  interestPayer: MERCHANT
                  available: true
                - packageId: pkg-9
                  tenorMonths: 9
                  monthlyInstalment:
                    amount: 1400000
                    currency: VND
                  totalPayable:
                    amount: 12600000
                    currency: VND
                  eir: 0.125
                  interestPayer: CUSTOMER
                  available: true
                - packageId: pkg-12
                  tenorMonths: 12
                  monthlyInstalment:
                    amount: 1085000
                    currency: VND
                  totalPayable:
                    amount: 13020000
                    currency: VND
                  eir: 0.165
                  interestPayer: CUSTOMER
                  available: true
                reasonCodes: []
                nextRung:
                  sourceId: AD-03
                  name: Tài khoản lương HLB
                  rank: 3
                  unlockLimit:
                    amount: 30000000
                    currency: VND
                expiresAt: '2026-10-03T09:30:00Z'
                lockup: Được cung cấp bởi Hong Leong Bank
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/offers/{offerRequestId}:
    get:
      operationId: getOfferSet
      tags:
      - offers
      summary: Fetch an offer set (idempotent replay)
      x-stories:
      - US-06
      parameters:
      - name: offerRequestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferSet'
              example:
                offerRequestId: b1c0e3a2-6f7d-4b29-8c11-0d2e9a000001
                limit:
                  amount: 15000000
                  currency: VND
                rung: 3
                packages:
                - packageId: pkg-6
                  tenorMonths: 6
                  monthlyInstalment:
                    amount: 2000000
                    currency: VND
                  totalPayable:
                    amount: 12000000
                    currency: VND
                  eir: 0.0
                  interestPayer: MERCHANT
                  available: true
                - packageId: pkg-9
                  tenorMonths: 9
                  monthlyInstalment:
                    amount: 1400000
                    currency: VND
                  totalPayable:
                    amount: 12600000
                    currency: VND
                  eir: 0.125
                  interestPayer: CUSTOMER
                  available: true
                - packageId: pkg-12
                  tenorMonths: 12
                  monthlyInstalment:
                    amount: 1085000
                    currency: VND
                  totalPayable:
                    amount: 13020000
                    currency: VND
                  eir: 0.165
                  interestPayer: CUSTOMER
                  available: true
                reasonCodes: []
                nextRung:
                  sourceId: AD-03
                  name: Tài khoản lương HLB
                  rank: 3
                  unlockLimit:
                    amount: 30000000
                    currency: VND
                expiresAt: '2026-10-03T09:30:00Z'
                lockup: Được cung cấp bởi Hong Leong Bank
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/consents:
    post:
      operationId: createConsent
      tags:
      - consent
      summary: Store a signed consent receipt for one source (D-30)
      x-stories:
      - US-08
      - US-24
      - US-27
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentCreate'
            example:
              customerRef: cus_mai
              partnerId: viettel-money
              sourceId: AD-01
              purpose: Đánh giá khả năng trả nợ
              textVersion: hlb-consent-v1
              signature: sig_demo
              grantedAt: '2026-10-03T09:10:00Z'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
              example:
                receiptId: c0a1f0aa-1111-4d2e-9c3b-0000000000a1
                customerRef: cus_mai
                partnerId: viettel-money
                sourceId: AD-01
                purpose: Đánh giá khả năng trả nợ
                status: GRANTED
                grantedAt: '2026-10-03T09:10:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customers/{customerRef}/consents:
    get:
      operationId: listConsents
      tags:
      - consent
      summary: Consents of a customer
      x-stories:
      - US-09
      parameters:
      - name: customerRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentReceipt'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/consents/{receiptId}/withdraw:
    post:
      operationId: withdrawConsent
      tags:
      - consent
      summary: Withdraw a consent
      x-stories:
      - US-09
      parameters:
      - name: receiptId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/ekyc/verifications:
    post:
      operationId: createEkycVerification
      tags:
      - identity
      summary: Verify chip CCCD + face (simulated in the MVP)
      x-stories:
      - US-10
      - US-24
      - US-27
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EkycRequest'
            example:
              customerRef: cus_mai
              method: NFC_CHIP
              chipPayloadRef: chip_demo
              faceCaptureRef: face_demo
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EkycResult'
              example:
                verificationId: e0a1f0aa-2222-4d2e-9c3b-0000000000e1
                status: PASSED
                reusableUntil: '2026-10-03T10:10:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customers/{customerRef}/limit-ladder:
    get:
      operationId: getLimitLadder
      tags:
      - data-ladder
      summary: Ladder, limit and the data used per rung (R-16)
      x-stories:
      - US-12
      - US-13
      parameters:
      - name: customerRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitLadder'
              example:
                customerRef: cus_mai
                segment: SEG-2
                currentRung: 3
                currentLimit:
                  amount: 15000000
                  currency: VND
                cicState: NO_FILE
                rungs:
                - rung: 1
                  cap:
                    amount: 3000000
                    currency: VND
                  reached: true
                  sources:
                  - sourceId: B-01
                    name: CCCD chip + khuôn mặt
                    rank: 0
                  - sourceId: AD-02
                    name: Dữ liệu thanh toán và thiết bị
                    rank: 2
                    outputs:
                    - IN
                    connected: true
                - rung: 2
                  cap:
                    amount: 8000000
                    currency: VND
                  reached: true
                  sources:
                  - sourceId: AD-01
                    name: Lịch sử ví
                    rank: 1
                    outputs:
                    - RG
                    - AF
                    connected: true
                - rung: 3
                  cap:
                    amount: 15000000
                    currency: VND
                  reached: true
                  sources:
                  - sourceId: AD-05
                    name: Thanh toán hóa đơn
                    rank: 5
                    outputs:
                    - RG
                    connected: true
                nextSuggestion:
                  sourceId: AD-03
                  name: Tài khoản lương HLB
                  rank: 3
                  unlockLimit:
                    amount: 30000000
                    currency: VND
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/assessments:
    post:
      operationId: createAssessment
      tags:
      - decision
      summary: Assess and decide (tiered waterfall, F-02)
      x-stories:
      - US-16
      - US-17
      - US-19
      - US-24
      - US-27
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreate'
            example:
              customerRef: cus_mai
              offerRequestId: b1c0e3a2-6f7d-4b29-8c11-0d2e9a000001
              packageId: pkg-6
              productType: PAYMENT_INSTALLMENT
              amount:
                amount: 12000000
                currency: VND
              connectSources:
              - AD-01
              - AD-05
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
              example:
                decisionId: 7d3f6b9e-0c1a-4f64-9b1e-2a6a1c9b0001
                outcome: APPROVED
                tier: STP
                approvedAmount:
                  amount: 12000000
                  currency: VND
                tenorMonths: 6
                reasonCodes:
                - WALLET_INFLOW_STABLE
                - BILLS_ON_TIME
                explanationText: Ví của bạn có thu nhập đều đặn 12 tháng; hóa đơn điện nước trả đúng hạn.
                dataUsed:
                - sourceId: AD-01
                  name: Lịch sử ví Viettel Money
                  rank: 1
                  outputs:
                  - RG
                  - AF
                  connected: true
                  role: Thu nhập đều
                - sourceId: AD-05
                  name: Thanh toán hóa đơn
                  rank: 5
                  outputs:
                  - RG
                  connected: true
                  role: Trả đúng hạn
                ratings:
                  riskGrade: B
                  affordability:
                    amount: 3200000
                    currency: VND
                  integrity: PASS
                  limit:
                    amount: 15000000
                    currency: VND
                waterfall:
                - order: 1
                  sourceId: AD-02
                  status: QUERIED
                  costVnd: 0
                  latencyMs: 40
                - order: 2
                  sourceId: AD-01
                  status: QUERIED
                  costVnd: 2000
                  latencyMs: 310
                  stopReason: confident after AD-05
                - order: 3
                  sourceId: AD-05
                  status: QUERIED
                  costVnd: 1500
                  latencyMs: 250
                nextRung:
                  sourceId: AD-03
                  name: Tài khoản lương HLB
                  rank: 3
                  unlockLimit:
                    amount: 30000000
                    currency: VND
                latencyMs: 1900
                decidedAt: '2026-10-03T09:15:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/decisions/{decisionId}:
    get:
      operationId: getDecision
      tags:
      - decision
      summary: Fetch a decision
      x-stories:
      - US-17
      - US-30
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
              example:
                decisionId: 7d3f6b9e-0c1a-4f64-9b1e-2a6a1c9b0001
                outcome: APPROVED
                tier: STP
                approvedAmount:
                  amount: 12000000
                  currency: VND
                tenorMonths: 6
                reasonCodes:
                - WALLET_INFLOW_STABLE
                - BILLS_ON_TIME
                explanationText: Ví của bạn có thu nhập đều đặn 12 tháng; hóa đơn điện nước trả đúng hạn.
                dataUsed:
                - sourceId: AD-01
                  name: Lịch sử ví Viettel Money
                  rank: 1
                  outputs:
                  - RG
                  - AF
                  connected: true
                  role: Thu nhập đều
                - sourceId: AD-05
                  name: Thanh toán hóa đơn
                  rank: 5
                  outputs:
                  - RG
                  connected: true
                  role: Trả đúng hạn
                ratings:
                  riskGrade: B
                  affordability:
                    amount: 3200000
                    currency: VND
                  integrity: PASS
                  limit:
                    amount: 15000000
                    currency: VND
                waterfall:
                - order: 1
                  sourceId: AD-02
                  status: QUERIED
                  costVnd: 0
                  latencyMs: 40
                - order: 2
                  sourceId: AD-01
                  status: QUERIED
                  costVnd: 2000
                  latencyMs: 310
                  stopReason: confident after AD-05
                - order: 3
                  sourceId: AD-05
                  status: QUERIED
                  costVnd: 1500
                  latencyMs: 250
                nextRung:
                  sourceId: AD-03
                  name: Tài khoản lương HLB
                  rank: 3
                  unlockLimit:
                    amount: 30000000
                    currency: VND
                latencyMs: 1900
                decidedAt: '2026-10-03T09:15:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contracts:
    post:
      operationId: createContract
      tags:
      - contract
      summary: Create the HLB contract for an approved decision (D-32)
      x-stories:
      - US-20
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreate'
            example:
              decisionId: 7d3f6b9e-0c1a-4f64-9b1e-2a6a1c9b0001
              packageId: pkg-6
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
              example:
                contractId: c1000000-0000-4000-8000-000000000001
                lender: Hong Leong Bank Vietnam
                amount:
                  amount: 12000000
                  currency: VND
                tenorMonths: 6
                totalPayable:
                  amount: 12000000
                  currency: VND
                eir: 0.0
                schedule:
                - number: 1
                  dueDate: '2026-11-03'
                  amount:
                    amount: 2000000
                    currency: VND
                  status: DUE
                keyFacts:
                - Không có phí ẩn
                status: DRAFT
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/contracts/{contractId}/sign:
    post:
      operationId: signContract
      tags:
      - contract
      summary: Sign with OTP; books the loan
      x-stories:
      - US-20
      - US-05
      - US-11
      parameters:
      - name: contractId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractSign'
            example:
              otp: '123456'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
              example:
                loanId: a1000000-0000-4000-8000-000000000001
                customerRef: cus_mai
                partnerId: viettel-money
                productType: PAYMENT_INSTALLMENT
                status: ACTIVE
                principalRemaining:
                  amount: 12000000
                  currency: VND
                totalRemaining:
                  amount: 12000000
                  currency: VND
                eir: 0.0
                schedule: []
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customers/{customerRef}/loans:
    get:
      operationId: listLoans
      tags:
      - servicing
      summary: Loans of a customer
      x-stories:
      - US-21
      parameters:
      - name: customerRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Loan'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/loans/{loanId}/payments:
    post:
      operationId: createPayment
      tags:
      - servicing
      summary: Repay an instalment
      x-stories:
      - US-21
      parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              amount:
                amount: 2000000
                currency: VND
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/loans/{loanId}/settlement-quote:
    get:
      operationId: getSettlementQuote
      tags:
      - servicing
      summary: Early-settlement quote (no hidden fee)
      x-stories:
      - US-21
      parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementQuote'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/refunds:
    post:
      operationId: receiveRefundEvent
      tags:
      - refunds
      summary: 'Partner → CreditPulse: return or refund on the order (F-09)'
      x-stories:
      - US-22
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundEvent'
            example:
              loanId: a1000000-0000-4000-8000-000000000001
              orderRef: SPE-2026-0001
              refundAmount:
                amount: 3000000
                currency: VND
              reason: RETURN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResult'
              example:
                loanId: a1000000-0000-4000-8000-000000000001
                newPrincipal:
                  amount: 9000000
                  currency: VND
                pauseUntil: '2026-11-15'
                adverseCicReported: false
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/payouts:
    post:
      operationId: receivePayoutEvent
      tags:
      - income-lending
      summary: 'Grab → CreditPulse: payout cycle income (F-08)'
      x-stories:
      - US-25
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutEvent'
            example:
              loanId: a2000000-0000-4000-8000-000000000002
              cycleId: 2026-W40
              incomeAmount:
                amount: 0
                currency: VND
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeductionResult'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/webhooks/settlements:
    post:
      operationId: receiveSettlementEvent
      tags:
      - income-lending
      summary: 'Sổ Bán Hàng → CreditPulse: settlement received (F-07)'
      x-stories:
      - US-28
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementEvent'
            example:
              loanId: a3000000-0000-4000-8000-000000000003
              settlementId: stl_001
              grossAmount:
                amount: 4000000
                currency: VND
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeductionResult'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/customers/{customerRef}/graduation-offer:
    get:
      operationId: getGraduationOffer
      tags:
      - graduation
      summary: Graduation and referral payload (D-31)
      x-stories:
      - US-29
      - US-15
      parameters:
      - name: customerRef
        in: path
        required: true
        schema:
