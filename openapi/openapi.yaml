        newSchedule:
          type: array
          items:
            $ref: '#/components/schemas/Instalment'
        pauseUntil:
          type: string
          format: date
        adverseCicReported:
          type: boolean
      required:
      - loanId
      - newPrincipal
      - pauseUntil
    GraduationOffer:
      type: object
      properties:
        customerRef:
          type: string
        newLimit:
          $ref: '#/components/schemas/Money'
        productOffers:
          type: array
          items:
            type: string
        merchantCode:
          type: string
      required:
      - customerRef
      - newLimit
    DecisionSummary:
      type: object
      properties:
        decisionId:
          type: string
          format: uuid
        customerMask:
