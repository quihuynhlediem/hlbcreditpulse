      - CHECKER
      - COLLECTIONS
      - CASE_OFFICER
      - FINANCE_OPS
      - PARTNERSHIP
      - INTEGRATION
      - MODEL_DEVELOPER
      - VALIDATOR
      - RISK_HEAD
      - COMPLIANCE
      - HOTLINE
      - ADMIN
      - AUDITOR
    CaseType:
      type: string
      enum:
      - COMPLAINT
      - DISPUTE
      - DATA_ACCESS
      - DATA_EXPORT
      - DATA_CORRECTION
      - DATA_DELETION
      - CONSENT_WITHDRAWAL
      - HARDSHIP
    CaseStatus:
      type: string
      enum:
      - OPEN
      - ASSIGNED
      - WAITING_CUSTOMER
      - RESOLVED
      - CLOSED
    PartnerStatus:
      type: string
      enum:
      - draft
      - sandbox
      - certified
      - live
      - paused
