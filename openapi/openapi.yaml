        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescreenRequest'
            example:
              partnerId: viettel-money
              hashedCustomerId: h_9f2c…khoa
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrescreenResult'
              example:
                eligible: true
                bandMin:
                  amount: 5000000
                  currency: VND
                bandMax:
                  amount: 30000000
                  currency: VND
                rung: 4
                validUntil: '2026-10-10T00:00:00Z'
        default:
          description: Problem
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
