openapi: 3.1.0
info:
  title: HLB CreditPulse API
  version: 1.2.0
  summary: HLB CreditPulse — complete product contract (partner, servicing channel and staff console APIs)
  description: 'One API, one product (D-81): point-of-purchase instalments through three e-wallets — Viettel Money (R1), Grab (R2) and Sổ Bán Hàng (R3). Partners build the customer screens to the Partner
    UX & Content Specification and call the partner API (OAuth2 client credentials over mTLS). HLB-built surfaces use the servicing-channel API (OTP session) and the staff console API (HLB SSO). Money is
    integer VND. Examples use seed personas (build-pack/seed-data-spec.md); amounts are illustrative (D-28). Demo-only operations (scenario, reset, API-call inspector) are not part of this contract; the
    Stage 1 demo keeps them in its own overlay (Step 19). Owner: Step 11. v1.1.0 (R-25, D-77 – D-79): the engine decides 100% of applications (APPROVED, COUNTER_OFFER, DECLINED) within 10 s; the appeal
    review is replaced by customer-requested appeals. v1.2.0 (R-28, D-81): Grab and Sổ Bán Hàng work like Viettel Money; the driver-loan and seller-funding product types, payout and settlement events are
    removed.'
  license:
    name: Proprietary — Hong Leong Bank Vietnam
  x-cross-cutting-stories:
    US-35: Every partner operation (partnerOAuth + partnerMtls security, Idempotency-Key header, problem+json errors)
    US-46: Internal daily DPD job (no API); results visible through listCollectionsCases and loan payloads
    US-50: Static public page of the servicing channel (no API)
servers:
- url: https://sandbox.api.creditpulse.hlb.example
  description: Partner sandbox (placeholder host)
- url: https://api.creditpulse.hlb.example
  description: Production, HLB Vietnam in-country environment (D-68; placeholder host)
security:
- partnerOAuth: []
  partnerMtls: []
tags:
- name: pre-screen
- name: offers
- name: consent
- name: identity
- name: data-ladder
- name: decision
- name: contract
- name: servicing
- name: refunds
- name: graduation
- name: cases
- name: servicing-channel
- name: console
